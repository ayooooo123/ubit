[package]
name = "ubit"
version = "0.3.3"
edition = "2021"
license = "MIT"
description = "Sandboxed embeddable SDK for uBit (35+ site extractors, HLS/DASH/TS demux, zero-FFmpeg fast-start MP4/M4A muxer, and public-IP SSRF guard)"
links = "ubit_sdk"

[lib]
name = "ubit"
path = "sdk/rust/lib.rs"

[dependencies]
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync", "time"] }
webpki-roots = "1"

[build-dependencies]
cc = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time"] }
